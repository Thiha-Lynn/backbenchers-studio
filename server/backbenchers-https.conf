map $http_origin $backbenchers_origin {
    default 0;
    "https://thiha-lynn.github.io" 1;
    "http://127.0.0.1:5175" 1;
}
limit_req_zone $binary_remote_addr zone=backbenchers_desktop:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=backbenchers_connections:1m;
server {
    listen 80;
    server_name backbenchers.3-0-126-159.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name backbenchers.3-0-126-159.nip.io;
    ssl_certificate /etc/letsencrypt/live/backbenchers-desktop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backbenchers-desktop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /websockify {
        if ($backbenchers_origin = 0) { return 403; }
        limit_req zone=backbenchers_desktop burst=5 nodelay;
        limit_conn backbenchers_connections 4;
        proxy_pass http://10.197.44.177:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / { default_type text/plain; return 200 "Backbenchers Studio / Ubuntu 24.04 LTS\nCrew password required for desktop access.\n"; }
}
